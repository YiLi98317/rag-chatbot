name: deploy-ecs

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Use repository directly - metadata action handles lowercase conversion
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare docker-compose.yml with image reference
        run: |
          # Convert repository to lowercase (Docker requirement)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Repository (lowercase): ${REPO_LOWER}"
          echo "Image will be: ghcr.io/${REPO_LOWER}:latest"
          # Replace the image reference in docker-compose.yml
          sed "s|ghcr.io/\${GITHUB_REPOSITORY:-owner/repo}:latest|ghcr.io/${REPO_LOWER}:latest|g" deploy/docker-compose.yml > deploy/docker-compose.prod.yml
          # Verify the replacement worked
          echo "Verifying replacement:"
          grep "image:" deploy/docker-compose.prod.yml | grep "api" -A 1 || true

      - name: Copy docker-compose.yml to ECS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT || '22' }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          source: "deploy/docker-compose.prod.yml"
          target: "/opt/rag"

      - name: Rename docker-compose file on ECS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT || '22' }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          script: |
            mkdir -p /opt/rag
            mv /opt/rag/deploy/docker-compose.prod.yml /opt/rag/docker-compose.yml
            rmdir /opt/rag/deploy 2>/dev/null || true

      - name: Generate .env file on ECS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT || '22' }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          script: |
            mkdir -p /opt/rag
            cat > /opt/rag/.env << ENVEOF
            VECTOR_PROVIDER=${{ secrets.VECTOR_PROVIDER }}
            MILVUS_URI=${{ secrets.MILVUS_URI }}
            MILVUS_DB=${{ secrets.MILVUS_DB }}
            MILVUS_COLLECTION=${{ secrets.MILVUS_COLLECTION }}
            OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
            EMBED_PROVIDER=${{ secrets.EMBED_PROVIDER }}
            EMBED_MODEL=${{ secrets.EMBED_MODEL }}
            CHAT_MODEL=${{ secrets.CHAT_MODEL }}
            TOP_K_DEFAULT=${{ secrets.TOP_K_DEFAULT }}
            DEBUG_TRACES=${{ secrets.DEBUG_TRACES }}
            API_KEY=${{ secrets.API_KEY }}
            API_BASE_URL=${{ secrets.API_BASE_URL }}
            MODEL_NAME=${{ secrets.MODEL_NAME }}
            LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
            ENVEOF
            # Apply defaults for empty values
            sed -i 's/^VECTOR_PROVIDER=$/VECTOR_PROVIDER=milvus/' /opt/rag/.env
            sed -i 's|^MILVUS_URI=$|MILVUS_URI=http://milvus:19530|' /opt/rag/.env
            sed -i 's/^MILVUS_DB=$/MILVUS_DB=default/' /opt/rag/.env
            sed -i 's/^MILVUS_COLLECTION=$/MILVUS_COLLECTION=chatbot_docs/' /opt/rag/.env
            sed -i 's|^OLLAMA_BASE_URL=$|OLLAMA_BASE_URL=http://ollama:11434|' /opt/rag/.env
            sed -i 's/^EMBED_PROVIDER=$/EMBED_PROVIDER=sentence_transformers/' /opt/rag/.env
            sed -i 's|^EMBED_MODEL=$|EMBED_MODEL=BAAI/bge-m3|' /opt/rag/.env
            sed -i 's/^CHAT_MODEL=$/CHAT_MODEL=deepseek-r1/' /opt/rag/.env
            sed -i 's/^TOP_K_DEFAULT=$/TOP_K_DEFAULT=10/' /opt/rag/.env
            sed -i 's/^DEBUG_TRACES=$/DEBUG_TRACES=0/' /opt/rag/.env
            sed -i 's|^API_BASE_URL=$|API_BASE_URL=https://api.deepseek.com|' /opt/rag/.env
            sed -i 's/^MODEL_NAME=$/MODEL_NAME=deepseek-chat/' /opt/rag/.env
            sed -i 's/^LLM_PROVIDER=$/LLM_PROVIDER=deepseek/' /opt/rag/.env
            # Add Qdrant vars if provided
            [ -n "${{ secrets.QDRANT_URL }}" ] && echo "QDRANT_URL=${{ secrets.QDRANT_URL }}" >> /opt/rag/.env
            [ -n "${{ secrets.QDRANT_API_KEY }}" ] && echo "QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}" >> /opt/rag/.env
            chmod 600 /opt/rag/.env

      - name: Deploy services on ECS
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.ECS_GHCR_TOKEN }}
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT || '22' }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          envs: GHCR_TOKEN
          script: |
            cd /opt/rag
            COMPOSE_FILE="/opt/rag/docker-compose.yml"

            echo "=== Verifying docker-compose file exists ==="
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "ERROR: docker-compose.yml not found at $COMPOSE_FILE"
              ls -la /opt/rag/
              exit 1
            fi
            echo "✅ Found docker-compose.yml"

            echo ""
            echo "=== Logging into GHCR ==="
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo ""
            echo "=== Pulling latest API image ==="
            # Convert repository to lowercase for image pull (Docker requirement)
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            API_IMAGE="ghcr.io/${REPO_LOWER}:latest"
            echo "Pulling ${API_IMAGE}... (no timeout, may take several minutes for large image)"
            # Verify the image name in docker-compose matches
            COMPOSE_IMAGE=$(grep "image:" "$COMPOSE_FILE" | grep "api" -A 1 | grep "image:" | sed 's/.*image: *//' | head -1)
            echo "Docker-compose expects image: ${COMPOSE_IMAGE}"
            for retry in 1 2 3; do
              if docker pull "${API_IMAGE}" 2>&1; then
                echo "✅ API image pulled successfully"
                break
              else
                if [ $retry -eq 3 ]; then
                  echo "⚠️  Failed to pull API image after 3 attempts, will use existing if available"
                else
                  echo "Retrying API image pull in 10s..."
                  sleep 10
                fi
              fi
            done

            echo ""
            echo "=== Starting infrastructure services first ==="
            echo "Pulling infrastructure images with retries..."
            for service in etcd minio; do
              echo "Pulling ${service}..."
              for retry in 1 2 3; do
                if docker compose -f "$COMPOSE_FILE" pull "${service}" 2>&1; then
                  echo "✅ ${service} pulled successfully"
                  break
                else
                  if [ $retry -eq 3 ]; then
                    echo "⚠️  Failed to pull ${service} after 3 attempts, continuing..."
                  else
                    echo "Retrying ${service} pull in 5s..."
                    sleep 5
                  fi
                fi
              done
            done

            docker compose -f "$COMPOSE_FILE" up -d etcd minio

            echo ""
            echo "=== Waiting for etcd and minio to be healthy ==="
            for i in {1..30}; do
              if docker compose -f "$COMPOSE_FILE" ps etcd minio 2>/dev/null | grep -qE "(healthy|Up)"; then
                echo "✅ Infrastructure services are up"
                break
              fi
              echo "Waiting for infrastructure... ($i/30)"
              sleep 2
            done

            echo ""
            echo "=== Starting Milvus and Ollama ==="
            echo "Pulling Milvus and Ollama images with retries..."
            for service in milvus ollama; do
              echo "Pulling ${service}..."
              for retry in 1 2 3; do
                if docker compose -f "$COMPOSE_FILE" pull "${service}" 2>&1; then
                  echo "✅ ${service} pulled successfully"
                  break
                else
                  if [ $retry -eq 3 ]; then
                    echo "⚠️  Failed to pull ${service} after 3 attempts, continuing..."
                  else
                    echo "Retrying ${service} pull in 5s..."
                    sleep 5
                  fi
                fi
              done
            done

            docker compose -f "$COMPOSE_FILE" up -d milvus ollama

            echo ""
            echo "=== Waiting for Milvus and Ollama to be healthy ==="
            for i in {1..60}; do
              milvus_status=$(docker compose -f "$COMPOSE_FILE" ps milvus 2>/dev/null | grep -oE "(healthy|unhealthy|Up)" | head -1 || echo "unknown")
              ollama_status=$(docker compose -f "$COMPOSE_FILE" ps ollama 2>/dev/null | grep -oE "(healthy|unhealthy|Up)" | head -1 || echo "unknown")
              if [[ "$milvus_status" == *"healthy"* ]] && [[ "$ollama_status" == *"healthy"* ]]; then
                echo "✅ Milvus and Ollama are healthy"
                break
              elif [[ "$milvus_status" == *"Up"* ]] && [[ "$ollama_status" == *"Up"* ]] && [ $i -gt 20 ]; then
                echo "⚠️  Services are up but not yet healthy, proceeding..."
                break
              fi
              echo "Waiting for Milvus ($milvus_status) and Ollama ($ollama_status)... ($i/60)"
              sleep 3
            done

            echo ""
            echo "=== Pulling Ollama chat model ==="
            CHAT_MODEL=$(grep '^CHAT_MODEL=' /opt/rag/.env 2>/dev/null | cut -d= -f2-)
            CHAT_MODEL=${CHAT_MODEL:-deepseek-r1}
            echo "Pulling model: ${CHAT_MODEL}"
            if docker compose -f "$COMPOSE_FILE" exec -T ollama ollama pull "${CHAT_MODEL}" 2>&1; then
              echo "✅ Ollama model ${CHAT_MODEL} pulled successfully"
            else
              echo "⚠️  Failed to pull Ollama model ${CHAT_MODEL}, API may fail if model is missing"
            fi

            echo ""
            echo "=== Starting API service ==="
            docker compose -f "$COMPOSE_FILE" up -d api

            echo ""
            echo "=== Waiting for API to start ==="
            sleep 20

            echo ""
            echo "=== Service status ==="
            docker compose -f "$COMPOSE_FILE" ps

            echo ""
            echo "=== Checking API container ==="
            if docker ps | grep -q rag_api; then
              echo "✅ API container is running"
              echo ""
              echo "API logs (last 30 lines):"
              docker logs rag_api 2>&1 | tail -30
            else
              echo "⚠️  API container not found in running containers"
              docker ps -a | grep rag_api || echo "API container not found at all"
              echo ""
              echo "All containers:"
              docker ps -a
              echo ""
              echo "=== Checking docker-compose logs ==="
              docker compose -f "$COMPOSE_FILE" logs api --tail=50
            fi

            echo ""
            echo "=== Cleaning up old images ==="
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT || '22' }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          script: |
            cd /opt/rag
            COMPOSE_FILE="/opt/rag/docker-compose.yml"
            echo "=== Checking service status ==="
            docker compose -f "$COMPOSE_FILE" ps

            echo ""
            echo "=== Waiting for services to be healthy ==="
            sleep 15

            echo ""
            echo "=== Checking API container status ==="
            if ! docker ps | grep -q rag_api; then
              echo "ERROR: API container is not running!"
              echo "All containers:"
              docker ps -a
              echo ""
              echo "API container logs:"
              docker logs rag_api 2>&1 | tail -100 || echo "Could not fetch logs"
              exit 1
            fi

            echo ""
            echo "=== Checking if port 80 is listening ==="
            netstat -tlnp 2>/dev/null | grep :80 || ss -tlnp 2>/dev/null | grep :80 || echo "Port 80 check unavailable (may need root)"

            echo ""
            echo "=== Checking if API container is listening on port 8000 ==="
            if docker exec rag_api curl -f http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "✅ API is responding inside container"
              docker exec rag_api curl -s http://localhost:8000/healthz
            else
              echo "⚠️  API not responding inside container"
            fi

            echo ""
            echo "=== Checking API health endpoint ==="
            # Check API health with more verbose output
            for i in {1..40}; do
              if curl -f -s http://localhost/healthz > /dev/null 2>&1; then
                echo "✅ API health check passed!"
                curl -s http://localhost/healthz | head -5
                break
              fi
              if [ $i -eq 1 ]; then
                echo "Attempting first health check..."
                curl -v http://localhost/healthz 2>&1 | head -20 || true
              fi
              echo "Waiting for API... ($i/40)"
              sleep 3
            done

            echo ""
            echo "=== Final health check ==="
            if ! curl -f http://localhost/healthz > /dev/null 2>&1; then
              echo "❌ Health check failed after all attempts"
              echo ""
              echo "=== Service status ==="
              docker compose -f "$COMPOSE_FILE" ps
              echo ""
              echo "=== API container logs (last 100 lines) ==="
              docker logs rag_api 2>&1 | tail -100
              echo ""
              echo "=== All service logs (last 50 lines) ==="
              docker compose -f /opt/rag/docker-compose.yml logs --tail=50
              echo ""
              echo "=== Checking API container health ==="
              docker inspect rag_api --format='{{.State.Status}} - {{.State.Health.Status}}' || true
              exit 1
            fi

            echo ""
            echo "=== Deployment verification successful! ==="
            docker compose -f "$COMPOSE_FILE" ps
