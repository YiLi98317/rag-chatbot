services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ALLOW_NONE_AUTHENTICATION=yes
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      -listen-peer-urls=http://0.0.0.0:2380
      -initial-advertise-peer-urls=http://etcd:2380
      -initial-cluster=etcd=http://etcd:2380
      -initial-cluster-state=new
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.5
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    depends_on:
      - milvus
      - ollama
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      VECTOR_PROVIDER: milvus
      MILVUS_URI: http://milvus:19530
      MILVUS_DB: default
      MILVUS_COLLECTION: chatbot_docs
      # Ollama runs as a docker-compose service on the same network.
      OLLAMA_BASE_URL: http://ollama:11434
      # Embeddings run locally in the API container (SentenceTransformers + HF).
      EMBED_PROVIDER: sentence_transformers
      EMBED_MODEL: BAAI/bge-m3
      # Chat runs via Ollama (ensure model exists in Ollama: `ollama pull deepseek-r1`).
      CHAT_MODEL: deepseek-r1
      TOP_K_DEFAULT: 10
      DEBUG_TRACES: 0
      # Override via .env: TOP_K or TOP_K_DEFAULT, LLM_MAX_TOKENS or MAX_TOKEN

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:

