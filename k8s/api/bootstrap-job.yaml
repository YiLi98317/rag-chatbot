apiVersion: batch/v1
kind: Job
metadata:
  name: chatbot-bootstrap
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: chatbot-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: chatbot-api:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: chatbot-api-config
            - secretRef:
                name: chatbot-api-secrets
          command: ["python", "scripts/bootstrap_collection.py"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

