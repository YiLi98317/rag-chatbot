apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      volumes:
        - name: ollama-data
          emptyDir: {}
        - name: rag-data
          emptyDir: {}

      # Init container: pull model into shared volume before main containers start
      initContainers:
        - name: ollama-pull
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rag-api-config
          env:
            - name: OLLAMA_HOST
              value: "127.0.0.1:11434"
          command:
            - sh
            - -c
            - |
              set -eu
              model="${CHAT_MODEL:-deepseek-r1}"
              echo "ollama-pull: starting temporary server"
              ollama serve >/tmp/ollama.log 2>&1 &
              pid="$!"
              echo "ollama-pull: waiting for server to be ready"
              for i in $(seq 1 90); do
                if ollama list >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
              echo "ollama-pull: pulling model=${model}"
              ollama pull "${model}"
              echo "ollama-pull: stopping server"
              kill "${pid}"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama

        # Init container: bootstrap the vector collection (Milvus Lite DB lives on /data)
        - name: bootstrap-collection
          image: rag-api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rag-api-config
            - secretRef:
                name: rag-api-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          command: ["python", "scripts/bootstrap_collection.py"]
          volumeMounts:
            - name: rag-data
              mountPath: /data

      containers:
        # API container
        - name: rag-api
          image: rag-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-api-config
            - secretRef:
                name: rag-api-secrets
          env:
            - name: PORT
              value: "8000"
          volumeMounts:
            - name: rag-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

        # Ollama sidecar container
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: ollama
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          readinessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: "500m"
              # Keep schedulable on laptop-sized kind nodes.
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "12Gi"

