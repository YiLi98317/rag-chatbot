apiVersion: batch/v1
kind: Job
metadata:
  name: rag-bootstrap
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: rag-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: rag-api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rag-api-config
            - secretRef:
                name: rag-api-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          command: ["python", "scripts/bootstrap_collection.py"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

